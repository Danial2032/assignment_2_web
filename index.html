<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Flexbox and Grid</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>

    <div class="page-container">

      <header class="header">
        <div class="logo">Logo</div>
        <ul class="nav-links">
          <li><a href="#">Link 1</a></li>
          <li><a href="#">Link 2</a></li>
          <li><a href="#">Link 3</a></li>
        </ul>
      </header>

      <aside class="sidebar">
        <h3>Sidebar</h3>
      </aside>

      <main class="main">

        <section>
          <h2>Cards</h2>
          <div class="card-row">
            <div class="card">
              <img src="images/card-1.jpg" alt="1" width="100%">
              <h3>Title</h3>
              <p>Text</p>
              <button>Btn</button>
            </div>
            <div class="card">
              <img src="images/card-2.jpeg" alt="2" width="100%">
              <h3>Title</h3>
              <p>Text</p>
              <button>Btn</button>
            </div>
            <div class="card">
              <img src="images/card-3.jpeg" alt="3" width="100%">
              <h3>Title</h3>
              <p>Text</p>
              <button>Btn</button>
            </div>
          </div>
        </section>

        <section>
          <h2>Projects</h2>
          <div class="projects-grid">
            <div class="project-card">
              <h3>Title 1</h3>
              <p>Description</p>
              <button>View</button>
            </div>
            <div class="project-card">
              <h3>Title 2</h3>
              <p>Description</p>
              <button>View</button>
            </div>
          </div>
        </section>

        <section>
          <h2>Gallery</h2>
          <div class="gallery-grid">
            <div class="gallery-item"><img src="images/gallery-1.jpg" alt="1" width="100%"><div class="overlay">Cap 1</div></div>
            <div class="gallery-item"><img src="images/gallery-2.jpeg" alt="2" width="100%"><div class="overlay">Cap 2</div></div>
            <div class="gallery-item"><img src="images/gallery-3.jpeg" alt="3" width="100%"><div class="overlay">Cap 3</div></div>
            <div class="gallery-item"><img src="images/gallery-4.jpg" alt="4" width="100%"><div class="overlay">Cap 4</div></div>
            <div class="gallery-item"><img src="images/gallery-5.jpeg" alt="5" width="100%"><div class="overlay">Cap 5</div></div>
            <div class="gallery-item"><img src="images/gallery-6.jpeg" alt="6" width="100%"><div class="overlay">Cap 6</div></div>
            <div class="gallery-item"><img src="images/gallery-7.jpeg" alt="7" width="100%"><div class="overlay">Cap 7</div></div>
            <div class="gallery-item"><img src="images/gallery-8.jpeg" alt="8" width="100%"><div class="overlay">Cap 8</div></div>
            <div class="gallery-item"><img src="images/gallery-9.jpg" alt="9" width="100%"><div class="overlay">Cap 9</div></div>
          </div>
        </section>

      </main>

      <footer class="footer">
        <p>Footer</p>
      </footer>

    </div>
    
  </body>
</html>
